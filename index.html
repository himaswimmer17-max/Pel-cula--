<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أفلامي - Películas</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: #1e293b; padding: 10px; border-radius: 10px; text-align: center; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; }
        .btn { padding: 8px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 10px; width: 90%; max-width: 600px; }
    </style>
</head>
<body>

<header style="display:flex; justify-content:space-between; align-items:center;">
    <h1>أفلامي</h1>
    <button class="btn" onclick="adminLogin()">➕ إضافة</button>
</header>

<div id="moviesGrid" class="movies-grid"></div>

<!-- نافذة الأدمن -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">إضافة/تعديل فيلم</h2>
        <input type="text" id="mName" placeholder="الاسم" class="btn" style="width:90%">
        <input type="text" id="mUrl" placeholder="رابط الفيديو (Direct Link)" class="btn" style="width:90%">
        <input type="text" id="mImg" placeholder="رابط الصورة" class="btn" style="width:90%">
        <button class="btn" onclick="saveMovie()">حفظ</button>
        <button class="btn" onclick="closeModals()">إغلاق</button>
    </div>
</div>

<!-- نافذة المشاهدة -->
<div id="watchModal" class="modal">
    <div class="modal-content" style="height: 80vh;">
        <iframe id="videoFrame" width="100%" height="90%" frameborder="0" allowfullscreen></iframe>
        <button class="btn" onclick="closeModals()">إغلاق</button>
    </div>
</div>

<script>
    const DB_URL = "https://ms-store-26105-default-rtdb.firebaseio.com/movies.json";
    let movies = {};
    let editKey = null;

    function fetchMovies() {
        fetch(DB_URL).then(r => r.json()).then(data => {
            movies = data || {};
            render();
        });
    }

    function render() {
        const grid = document.getElementById('moviesGrid');
        grid.innerHTML = '';
        for (let key in movies) {
            let m = movies[key];
            grid.innerHTML += `
                <div class="card">
                    <img src="${m.image || 'https://via.placeholder.com/200'}" onerror="this.src='https://via.placeholder.com/200'">
                    <h3>${m.name}</h3>
                    <button class="btn" onclick="watch('${m.video}')">مشاهدة</button>
                    <div id="adminControls" style="display:none;">
                        <button class="btn" onclick="edit('${key}')">تعديل</button>
                        <button class="btn" style="background:red" onclick="del('${key}')">حذف</button>
                    </div>
                </div>
            `;
        }
    }

    function watch(url) {
        document.getElementById('videoFrame').src = url;
        document.getElementById('watchModal').classList.add('active');
    }

    function adminLogin() {
        let pass = prompt("كلمة المرور:");
        if (pass === "hima2sina26") {
            document.querySelectorAll('#adminControls').forEach(el => el.style.display = 'block');
            openModal();
        } else alert("خطأ!");
    }

    function openModal(key = null) {
        editKey = key;
        if (key) {
            document.getElementById('mName').value = movies[key].name;
            document.getElementById('mUrl').value = movies[key].video;
            document.getElementById('mImg').value = movies[key].image;
        }
        document.getElementById('adminModal').classList.add('active');
    }

    function saveMovie() {
        let data = { name: document.getElementById('mName').value, video: document.getElementById('mUrl').value, image: document.getElementById('mImg').value };
        let method = editKey ? "PATCH" : "POST";
        let url = editKey ? `https://ms-store-26105-default-rtdb.firebaseio.com/movies/${editKey}.json` : DB_URL;
        
        fetch(url, { method: method, body: JSON.stringify(data) }).then(() => {
            closeModals();
            fetchMovies();
        });
    }

    function edit(key) { openModal(key); }
    function del(key) {
        if(confirm("مسح؟")) {
            fetch(`https://ms-store-26105-default-rtdb.firebaseio.com/movies/${key}.json`, { method: "DELETE" }).then(fetchMovies);
        }
    }
    function closeModals() {
        document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        document.getElementById('videoFrame').src = '';
    }

    fetchMovies();
</script>
</body>
</html>
